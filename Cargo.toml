[package]
name = "ghostwriter"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "Local speech-to-text dictation for the COSMIC desktop"
repository = "https://github.com/hmrdsmoke/GhostWriter"

# Whisper backend. The default is CUDA (NVIDIA). Build with
#   --no-default-features                    for CPU only
#   --no-default-features --features vulkan  for any GPU with Vulkan
# The code also uses these to pick the default model for the build.
[features]
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }
# Microphone capture.
cpal = "0.18"
# Whisper inference (whisper.cpp bindings). Backend chosen by the features above.
whisper-rs = "0.16"
# Virtual keyboard on /dev/uinput — how the text reaches the focused window.
evdev = "0.13"
# Session-bus endpoint so a hotkey (`ghostwriter --toggle`) can reach the running applet.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Fetching the model on first run.
ureq = "3"
# Desktop notifications for download progress and problems.
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "4657b6a7259e6ecdbf0af6f956de163e3d49dc1a"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }