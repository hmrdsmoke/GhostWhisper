[package]
name = "ghostwhisper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Local speech-to-text dictation for the COSMIC desktop"
repository = "https://github.com/hmrdsmoke/GhostWhisper"

# Whisper backend. The default is CUDA (NVIDIA). Build with
#   --no-default-features                    for CPU only
#   --no-default-features --features vulkan  for any GPU with Vulkan
# The code also uses these to pick the default model for the build.
[features]
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
tokio = { version = "1.52.0", features = ["full"] }
# Microphone capture.
cpal = "0.18"
# Whisper inference (whisper.cpp bindings). Backend chosen by the features above.
whisper-rs = "0.16"
# Virtual keyboard on /dev/uinput — how the text reaches the focused window.
evdev = "0.13"
# Session-bus endpoint so a hotkey (`ghostwhisper --toggle`) can reach the running applet.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Fetching the model when the user asks for it.
ureq = "3"
# Desktop notifications for download progress and problems.
notify-rust = { version = "4", default-features = false, features = ["z-with-tokio"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "4657b6a7259e6ecdbf0af6f956de163e3d49dc1a"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

# `cargo deb` reads this. Shared-library dependencies are detected from the
# built binary; the maintainer scripts in packaging/deb/ set up /dev/uinput.
[package.metadata.deb]
maintainer = "HMRDSmoke Software LLC <hmrdsmoke@users.noreply.github.com>"
copyright = "2026, HMRDSmoke Software LLC"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "packaging/deb/"
extended-description = """\
Press a hotkey, talk, press it again: the words are typed into whatever \
window has keyboard focus, through a virtual keyboard on /dev/uinput. \
Speech recognition runs locally with Whisper (whisper.cpp); no audio leaves \
the machine. This package is built for NVIDIA GPUs (CUDA)."""
assets = [
    ["target/release/ghostwhisper", "usr/bin/", "755"],
    ["target/xdgen/app.desktop", "usr/share/applications/io.github.hmrdsmoke.GhostWhisper.desktop", "644"],
    ["target/xdgen/app.metainfo.xml", "usr/share/metainfo/io.github.hmrdsmoke.GhostWhisper.metainfo.xml", "644"],
    ["resources/icon.svg", "usr/share/icons/hicolor/scalable/apps/io.github.hmrdsmoke.GhostWhisper.svg", "644"],
    ["resources/70-ghostwhisper-uinput.rules", "usr/lib/udev/rules.d/", "644"],
    ["README.md", "usr/share/doc/ghostwhisper/README.md", "644"],
    ["licenses.html", "usr/share/doc/ghostwhisper/licenses.html", "644"],
]

# `cargo deb --variant cpu` / `--variant vulkan` for machines without CUDA.
[package.metadata.deb.variants.cpu]
name = "ghostwhisper-cpu"
default-features = false
conflicts = "ghostwhisper, ghostwhisper-vulkan"
extended-description = """\
Press a hotkey, talk, press it again: the words are typed into whatever \
window has keyboard focus, through a virtual keyboard on /dev/uinput. \
Speech recognition runs locally with Whisper (whisper.cpp); no audio leaves \
the machine. This package runs Whisper on the CPU."""

[package.metadata.deb.variants.vulkan]
name = "ghostwhisper-vulkan"
default-features = false
features = ["vulkan"]
conflicts = "ghostwhisper, ghostwhisper-cpu"
extended-description = """\
Press a hotkey, talk, press it again: the words are typed into whatever \
window has keyboard focus, through a virtual keyboard on /dev/uinput. \
Speech recognition runs locally with Whisper (whisper.cpp); no audio leaves \
the machine. This package runs Whisper on any GPU with Vulkan."""