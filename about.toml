# cargo-about configuration.
#
# Generates the third-party license page that ships in the .deb at
# usr/share/doc/ghostwhisper/licenses.html:
#
#     cargo about generate about.hbs -o licenses.html
#
# Regenerate after any `cargo update`. If it refuses because a crate uses a
# license that isn't listed under `accepted`, add that license and rerun.

# Linux only: keeps the Windows/macOS/wasm-only crates off the page.
targets = ["x86_64-unknown-linux-gnu"]

# Build and dev dependencies don't ship in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
]

# ---------------------------------------------------------------------------
# Clarifications: crates whose Cargo.toml has no `license` field, or whose
# license file sits somewhere cargo-about doesn't look. `path` is relative to
# the crate's own directory in the cargo cache; `checksum` is the file's sha256
# (cargo-about refuses the file if it changes, so a `cargo update` that touches
# these will tell you to re-check them).
# ---------------------------------------------------------------------------

# whisper-rs-sys is Unlicense, but it compiles whisper.cpp and ggml (MIT) into
# the binary. Their copyright notice has to ship with it; this pulls it in.
[whisper-rs-sys.clarify]
license = "Unlicense AND MIT"

[[whisper-rs-sys.clarify.files]]
path = "whisper.cpp/LICENSE"
license = "MIT"
checksum = "e562a2ddfaf8280537795ac5ecd34e3012b6582a147ef69ba6a6a5c08c84757d"

